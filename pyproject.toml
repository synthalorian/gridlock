[project]
name = "gridlock"
version = "1.0.0"
description = "Distributed task queue with capability matching"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "redis>=5.0",
    "pydantic>=2.14.1",
    "websockets>=12.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "httpx>=0.27", "pytest-asyncio>=0.23", "fakeredis>=2.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
